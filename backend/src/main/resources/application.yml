server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: v3-dental-attendance-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/v3_dental_attendance}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:Nithish123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000} # 15 mins
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  timezone: ${APP_TIMEZONE:Asia/Kolkata}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
